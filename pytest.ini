[pytest]
# Without this, pytest walks the whole tree from the repo root. `outputs/` holds fourteen nested
# full copies of this repository, whose `scripts` packages shadow the real one in sys.modules:
# bare `pytest` then reports "1784 tests collected, 616 errors" and aborts collection, so the
# suite reads as broken to anyone who runs it the obvious way. That is how a real custody defect
# stayed hidden in the noise. Scoped here, `pytest` collects 2302 tests with zero errors.
testpaths = tests
norecursedirs = outputs tmp kaggle archive_untracked deliverables .git *.egg-info
