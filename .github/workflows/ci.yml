name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Lint, blocking (syntax errors and undefined names)
        run: ruff check . --select E9,F63,F7,F82
      - name: Lint, style report (non-blocking)
        run: ruff check . --exit-zero --statistics
      - name: Tests
        run: pytest tests/
